[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resonance-asri"
version = "0.1.0.dev0"
description = "Adaptive Sparse Recurrent Intelligence research runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["src/resonance_asri"]
